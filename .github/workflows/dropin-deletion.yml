name: Test deleting GitHub DNS drop-in
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: ${{ matrix.os }} / ${{ matrix.setup }} / sample ${{ matrix.sample }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        setup: [dropin-control, dropin-delete]
        sample: [1, 2]
    steps:
      - name: Configure and inspect DNS before Harden-Runner's pre-step
        uses: harden-runner-dns-tests/dns-tests/.github/actions/prepare@main
        env:
          DNS_TEST_SETUP: ${{ matrix.setup }}
      - name: Recover pre-step evidence
        if: always()
        run: cp -a "$RUNNER_TEMP/dns-repro/evidence" ./evidence
      - name: Harden Runner Community block mode
        id: harden
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            proxy.golang.org:443
          disable-sudo: false
      - name: Capture DNS and probe allowed and denied traffic
        if: always()
        run: |
          bash "$RUNNER_TEMP/dns-repro/snapshot.sh" after-harden |& tee evidence/after-harden.txt
          bash "$RUNNER_TEMP/dns-repro/probe.sh" after-harden |& tee evidence/probe-after-harden.txt
          sudo journalctl -u agent.service --no-pager | tee evidence/agent-journal.txt
          sudo journalctl -u egress-outbound-proxy -u egress-dns-resolver --no-pager | tee evidence/proxy-journal.txt
          {
            echo '### DNS reproduction evidence'
            echo 'Harden step outcome: ${{ steps.harden.outcome }}'
            echo 'Diagnostic completion does not mean compatibility passed. See each curl exit code.'
            echo 'github.com, api.github.com, proxy.golang.org are allowed; example.com is deliberately denied.'
            echo '```text'
            cat evidence/results.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore connectivity after all measurements
        if: always()
        run: |
          echo 'RECOVERY ONLY: allow outbound IPv4 after snapshots/probes, so evidence and runner status can upload.'
          sudo iptables -I OUTPUT 1 -j ACCEPT
          sudo iptables -I FORWARD 1 -j ACCEPT
      - name: Classify measured results
        if: always()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json
          p=Path('evidence/results.tsv')
          rows=[line.split('\t') for line in p.read_text().splitlines() if line.startswith('after-harden\t')] if p.exists() else []
          allowed=[r for r in rows if r[1] != 'example.com']
          denied=[r for r in rows if r[1] == 'example.com']
          result={'allowed_pass':len(allowed)==9 and all(r[3]=='0' for r in allowed), 'denied_blocked':len(denied)==3 and all(r[3]!='0' for r in denied), 'rows':rows}
          print(json.dumps(result,indent=2))
          Path('evidence/verdict.json').write_text(json.dumps(result,indent=2))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('\nMeasured verdict (before recovery): '+json.dumps(result)+'\n')
          PYCODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dns-${{ matrix.os }}-${{ matrix.setup }}-${{ matrix.sample }}
          path: evidence/
          retention-days: 14
